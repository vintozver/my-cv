<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Resume of Vitaly Greck, software engineer and technical leader with a focus on AI, adaptability, and continuous growth."
    >
    <title>Vitaly Greck | {{ section_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page">
      <aside class="sidebar">
        <header class="identity">
          <p class="eyebrow">Resume</p>
          <h1>Vitaly Greck</h1>
          <p class="role">Software Engineer &amp; Technical Leader</p>
          <p class="location">Kent, Washington</p>
          <div class="profile-links" aria-label="Professional profiles">
            <a href="https://www.linkedin.com/in/vintozver">LinkedIn</a>
            <a href="https://github.com/vintozver">GitHub</a>
            <a href="https://stackoverflow.com/users/884077/vitaly-greck">Stack Overflow</a>
          </div>
          <a class="download-link" href="{{ url_for('download_pdf') }}">Download as PDF</a>
        </header>

        <nav class="section-nav" aria-label="Resume sections">
          <p class="nav-label">Resume sections</p>
          <ul>
            {% for section, title in sections.items() %}
              <li>
                <a href="{{ url_for('section_page', section=section) }}"
                   {% if active_section == section %}aria-current="page"{% endif %}>{{ title }}</a>
              </li>
            {% endfor %}
          </ul>
        </nav>
      </aside>

      <main id="main">
        <section class="section" id="{{ active_section }}" aria-label="{{ section_title }}">
          {{ section_content }}
        </section>
        <footer class="footer">Vitaly Greck · Resume</footer>
      </main>
    </div>
  </body>
</html>
